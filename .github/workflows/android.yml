name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise Coelhitos in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            mkdir -p emulator-evidence
            adb shell settings put system screen_off_timeout 1800000
            # Cap the emulator surface so SwiftShader can keep up with Canvas.
            adb shell wm size 1280x720
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r com.coelhitos.test/androidx.test.runner.AndroidJUnitRunner > emulator-evidence/multitouch-tests.txt
            grep -Eq 'OK \([0-9]+ tests\)' emulator-evidence/multitouch-tests.txt
            adb shell am force-stop com.coelhitos
            adb shell am start -W -n com.coelhitos/.MainActivity
            sleep 3
            adb exec-out screencap -p > emulator-evidence/01-menu.png
            # The title screen defaults to phase 1; tap its JOGAR FASE button.
            adb shell input tap 640 604
            sleep 2
            # Dismiss Android's immersive-mode confirmation if it appeared.
            adb shell input tap 880 190
            sleep 1
            adb exec-out screencap -p > emulator-evidence/02-gameplay.png
            # 1280x720 landscape: stick center (134,612), action (1075,612), jump (1203,612).
            # Diagonal directions exercise forward/back jumps; vertical tests neutral.
            adb shell input swipe 180 560 180 560 700
            adb shell input swipe 80 560 80 560 700
            adb shell input swipe 134 560 134 560 700
            adb shell input tap 1203 612
            # Keep the stick active while holding AÇÃO to run, then tap AÇÃO
            # while moving to confirm a short release fires a projectile.
            adb shell input swipe 180 612 180 612 1200 & adb shell input swipe 1075 612 1075 612 700; wait
            adb shell input swipe 180 612 180 612 1200 & adb shell input tap 1075 612; wait
            # Sustain movement through hazards, then ensure the app stays alive.
            adb shell input swipe 180 612 180 612 15000
            sleep 2
            adb shell pidof com.coelhitos
            adb exec-out screencap -p > emulator-evidence/03-after-obstacles.png
            adb logcat -d -v threadtime > emulator-evidence/logcat.txt
            grep -q "CoelhitosInput: jump dir=1" emulator-evidence/logcat.txt
            grep -q "CoelhitosInput: jump dir=-1" emulator-evidence/logcat.txt
            grep -q "CoelhitosInput: jump dir=0" emulator-evidence/logcat.txt
            grep -q "CoelhitosInput: shoot" emulator-evidence/logcat.txt
            grep -q "jump dir=1 source=button" emulator-evidence/logcat.txt
            grep -q "jump dir=-1 source=button" emulator-evidence/logcat.txt
            grep -q "shoot dir=-1 moving=true" emulator-evidence/logcat.txt
            grep -q "shoot dir=1 moving=true" emulator-evidence/logcat.txt
            ! grep -E "FATAL EXCEPTION|ConcurrentModificationException" emulator-evidence/logcat.txt
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Coelhitos-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Coelhitos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


